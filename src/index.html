<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Minimal webpack template: vanilla JS + Babel, ESLint, Prettier, GitHub Pages deploy."
    />
    <title>Repo Template</title>
  </head>
  <body>
    <main class="app">
      <img class="logo" src="./assets/logo.svg" alt="Template logo" width="96" height="96" />
      <h1>It works 🎉</h1>
      <p class="subtitle">Vanilla JS + Babel + webpack + ESLint + Prettier</p>
      <div class="card">
        <button id="counter-btn" type="button">Count is 0</button>
        <p>Edit <code>src/index.js</code> and save to reload.</p>
      </div>
      <p class="hint">
        Run <code>npm start</code> for dev · <code>npm run build</code> for prod ·
        <code>npm run deploy</code> for GitHub Pages
      </p>
    </main>
  </body>
</html>
